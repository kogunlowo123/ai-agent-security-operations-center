# Default values for the soc-api Helm chart.
# Override these values in deploy/helm/umbrella/values.yaml or via --set flags.

# ---------------------------------------------------------------------------
# Replica and deployment configuration
# ---------------------------------------------------------------------------
replicaCount: 2

image:
  repository: ghcr.io/acme-corp/soc-api
  tag: ""  # Defaults to chart appVersion if empty
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-pull-secret

# ---------------------------------------------------------------------------
# Service configuration
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP
  annotations: {}

# ---------------------------------------------------------------------------
# Ingress configuration
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: soc-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: soc-api-tls
      hosts:
        - soc-api.example.com

# ---------------------------------------------------------------------------
# Resource requests and limits
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# ---------------------------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

# ---------------------------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ---------------------------------------------------------------------------
# Environment variables
# ---------------------------------------------------------------------------
env:
  # Application settings
  LOG_LEVEL: "INFO"
  APP_ENV: "production"
  APP_PORT: "8080"
  WORKERS: "4"

  # AWS region
  AWS_DEFAULT_REGION: "us-east-1"

  # Feature flags
  ENABLE_MITRE_ENRICHMENT: "true"
  ENABLE_POSTURE_SCORING: "true"
  ENABLE_THREAT_HUNTING: "true"

# Secrets sourced from Kubernetes secrets (created by External Secrets Operator)
envFromSecrets:
  - secretName: soc-api-secrets
    keys:
      - DATABASE_URL
      - JWT_SECRET
      - OPENSEARCH_PASSWORD
      - SQS_BASE_URL
      - BEDROCK_MODEL_ID

# ---------------------------------------------------------------------------
# ConfigMap-based configuration
# ---------------------------------------------------------------------------
config:
  opensearch:
    host: "opensearch.soc-platform.svc.cluster.local"
    port: 9200
    use_ssl: true
    verify_certs: true
    mitre_index: "mitre-attck-v14"
    events_index_pattern: "soc-events-*"
  sqs:
    region: "us-east-1"
    ingest_queue_name: "soc-ingest"
    hunt_queue_name: "soc-hunt"
    visibility_timeout: 120
    max_number_of_messages: 10
  jwt:
    algorithm: "RS256"
    audience: "ai-agent-soc-api"
    issuer: "ai-agent-soc"
    expiry_seconds: 3600
  posture:
    refresh_interval_seconds: 3600
    score_window_hours: 24

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/v1/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30  # 5s * 30 = 150s max startup time

# ---------------------------------------------------------------------------
# Security context
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Service account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "soc-api"
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set to IAM role ARN for IRSA

# ---------------------------------------------------------------------------
# Node scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: soc-api
          topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Volumes (for read-only root filesystem)
# ---------------------------------------------------------------------------
volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs

# ---------------------------------------------------------------------------
# Pod annotations
# ---------------------------------------------------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
  sidecar.istio.io/inject: "true"

# ---------------------------------------------------------------------------
# Extra labels
# ---------------------------------------------------------------------------
commonLabels:
  app.kubernetes.io/part-of: ai-agent-soc
  app.kubernetes.io/managed-by: helm
