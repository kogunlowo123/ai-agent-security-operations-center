# Default values for the soc-agent-runtime Helm chart.
# The agent-runtime service processes events from SQS, performs AI-assisted
# triage using Bedrock/Claude, and creates incidents in PostgreSQL.

# ---------------------------------------------------------------------------
# Replica and deployment configuration
# ---------------------------------------------------------------------------
replicaCount: 2

image:
  repository: ghcr.io/acme-corp/soc-agent-runtime
  tag: ""  # Defaults to chart appVersion if empty
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-pull-secret

# ---------------------------------------------------------------------------
# Service configuration
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
  protocol: TCP
  annotations: {}

# ---------------------------------------------------------------------------
# Resource requests and limits
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

# ---------------------------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  # Scale on SQS queue depth (preferred) or CPU/memory fallback
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75
  # External metrics for SQS-based scaling (requires KEDA or custom metrics adapter)
  externalMetrics:
    enabled: false
    sqsQueueName: "soc-ingest"
    targetQueueDepth: 100
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60

# ---------------------------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ---------------------------------------------------------------------------
# Environment variables
# ---------------------------------------------------------------------------
env:
  LOG_LEVEL: "INFO"
  APP_ENV: "production"
  AWS_DEFAULT_REGION: "us-east-1"

  # SQS consumer configuration
  SQS_VISIBILITY_TIMEOUT: "120"
  SQS_MAX_MESSAGES: "10"
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_MAX_CONCURRENT_WORKERS: "20"

  # AI model configuration
  BEDROCK_REGION: "us-east-1"
  TRIAGE_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
  ENRICHMENT_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
  HUNT_MODEL_ID: "anthropic.claude-3-5-sonnet-20241022-v2:0"

  # Model inference settings
  TRIAGE_MAX_TOKENS: "1024"
  TRIAGE_TEMPERATURE: "0.0"
  ENRICHMENT_MAX_TOKENS: "512"

  # RAG configuration
  MITRE_INDEX: "mitre-attck-v14"
  RAG_TOP_K: "5"
  RAG_SIMILARITY_THRESHOLD: "0.75"

  # Incident creation thresholds
  AUTO_CREATE_INCIDENT_SEVERITY: "HIGH,CRITICAL"
  AUTO_CREATE_INCIDENT_CONFIDENCE: "0.85"

  # Feature flags
  ENABLE_MITRE_ENRICHMENT: "true"
  ENABLE_AUTO_INCIDENT_CREATION: "true"
  ENABLE_CROSS_EVENT_CORRELATION: "true"

# Secrets sourced from Kubernetes secrets (created by External Secrets Operator)
envFromSecrets:
  - secretName: soc-agent-runtime-secrets
    keys:
      - DATABASE_URL
      - OPENSEARCH_PASSWORD
      - SQS_BASE_URL
      - SQS_HUNT_QUEUE_URL
      - BEDROCK_ACCESS_KEY_ID
      - BEDROCK_SECRET_ACCESS_KEY

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readiness
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 40  # 5s * 40 = 200s max startup

# ---------------------------------------------------------------------------
# Security context
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Service account with IRSA for AWS Bedrock and SQS
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "soc-agent-runtime"
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set to IAM role ARN with Bedrock + SQS permissions

# ---------------------------------------------------------------------------
# Node scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: soc-agent-runtime
          topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  - name: tmp
    emptyDir: {}
  - name: model-cache
    emptyDir:
      sizeLimit: "1Gi"

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: model-cache
    mountPath: /app/.cache

# ---------------------------------------------------------------------------
# Pod annotations
# ---------------------------------------------------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/metrics"
  sidecar.istio.io/inject: "true"

# ---------------------------------------------------------------------------
# Extra labels
# ---------------------------------------------------------------------------
commonLabels:
  app.kubernetes.io/part-of: ai-agent-soc
  app.kubernetes.io/managed-by: helm
  app.kubernetes.io/component: agent-runtime
