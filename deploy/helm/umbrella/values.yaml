# Umbrella chart values for the AI Agent SOC platform.
# These values override the sub-chart defaults.
#
# Sub-chart values are namespaced under their alias:
#   api.*          → overrides deploy/helm/api/values.yaml
#   agentRuntime.* → overrides deploy/helm/agent-runtime/values.yaml
#
# Usage:
#   helm install soc-platform ./deploy/helm/umbrella \
#     -n soc-platform \
#     -f ./deploy/helm/umbrella/values.yaml \
#     --set api.image.tag=v1.2.3 \
#     --set agentRuntime.image.tag=v1.2.3

# ---------------------------------------------------------------------------
# Global values shared across all sub-charts
# ---------------------------------------------------------------------------
global:
  # Image tag applied to all services when not overridden per-service
  imageTag: ""

  # AWS region used by all services
  awsRegion: "us-east-1"

  # Kubernetes namespace (ArgoCD handles namespace creation)
  namespace: "soc-platform"

  # External Secrets Operator store reference
  externalSecrets:
    enabled: true
    secretStoreName: "soc-aws-secrets-manager"
    refreshInterval: "1h"

  # Istio service mesh
  istio:
    enabled: true
    inject: true

  # OpenTelemetry collector endpoint
  otel:
    endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
    insecure: true

  # Shared image pull secrets
  imagePullSecrets:
    - name: ghcr-pull-secret

  # Common labels applied to all resources
  commonLabels:
    app.kubernetes.io/part-of: ai-agent-soc
    environment: production
    managed-by: helm

# ---------------------------------------------------------------------------
# Sub-chart enable/disable flags
# ---------------------------------------------------------------------------
api:
  enabled: true

agentRuntime:
  enabled: true

# ---------------------------------------------------------------------------
# API service overrides
# ---------------------------------------------------------------------------
api:
  enabled: true

  replicaCount: 2

  image:
    repository: ghcr.io/acme-corp/soc-api
    tag: ""  # Overrides global.imageTag when set

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: soc-api.acme-corp.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: soc-api-tls
        hosts:
          - soc-api.acme-corp.internal

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  env:
    LOG_LEVEL: "INFO"
    APP_ENV: "production"
    AWS_DEFAULT_REGION: "us-east-1"
    ENABLE_MITRE_ENRICHMENT: "true"
    ENABLE_POSTURE_SCORING: "true"
    ENABLE_THREAT_HUNTING: "true"

  config:
    opensearch:
      host: "opensearch.soc-platform.svc.cluster.local"
      port: 9200
      use_ssl: true
      mitre_index: "mitre-attck-v14"
      events_index_pattern: "soc-events-*"
    jwt:
      algorithm: "RS256"
      audience: "ai-agent-soc-api"
      issuer: "ai-agent-soc"
      expiry_seconds: 3600
    posture:
      refresh_interval_seconds: 3600

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: ""  # Override with actual IRSA role ARN

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# ---------------------------------------------------------------------------
# Agent Runtime overrides
# ---------------------------------------------------------------------------
agentRuntime:
  enabled: true

  replicaCount: 2

  image:
    repository: ghcr.io/acme-corp/soc-agent-runtime
    tag: ""  # Overrides global.imageTag when set

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

  env:
    LOG_LEVEL: "INFO"
    APP_ENV: "production"
    AWS_DEFAULT_REGION: "us-east-1"
    BEDROCK_REGION: "us-east-1"
    TRIAGE_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
    HUNT_MODEL_ID: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    SQS_MAX_CONCURRENT_WORKERS: "20"
    AUTO_CREATE_INCIDENT_SEVERITY: "HIGH,CRITICAL"
    AUTO_CREATE_INCIDENT_CONFIDENCE: "0.85"

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: ""  # Override with IRSA role ARN (Bedrock + SQS + RDS)

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"

# ---------------------------------------------------------------------------
# Environment-specific overrides (applied via -f values-{env}.yaml)
# ---------------------------------------------------------------------------

# Example: staging environment
# To create: cp values.yaml values-staging.yaml and set:
#
# global:
#   namespace: soc-platform-staging
#
# api:
#   replicaCount: 1
#   autoscaling:
#     minReplicas: 1
#     maxReplicas: 3
#   env:
#     APP_ENV: "staging"
#     LOG_LEVEL: "DEBUG"
#
# agentRuntime:
#   replicaCount: 1
#   autoscaling:
#     minReplicas: 1
#     maxReplicas: 5
#   env:
#     APP_ENV: "staging"
#     LOG_LEVEL: "DEBUG"
#     TRIAGE_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"

# ---------------------------------------------------------------------------
# Network policies (umbrella-level)
# ---------------------------------------------------------------------------
networkPolicies:
  enabled: true
  defaultDenyAll: true
  allowNamespaces:
    - kube-system
    - observability
    - ingress-nginx
    - istio-system
