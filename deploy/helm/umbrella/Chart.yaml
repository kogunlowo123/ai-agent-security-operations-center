apiVersion: v2
name: soc-platform
description: AI Agent Security Operations Centre — Umbrella Helm chart bundling all platform services
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - security
  - soc
  - ai-agent
  - platform
home: https://github.com/acme-corp/ai-agent-security-operations-center
sources:
  - https://github.com/acme-corp/ai-agent-security-operations-center
maintainers:
  - name: SOC Platform Team
    email: soc-platform@example.com
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: soc-api
    version: "0.1.0"
    repository: "file://../api"
    alias: api
    condition: api.enabled
    tags:
      - api
  - name: soc-agent-runtime
    version: "0.1.0"
    repository: "file://../agent-runtime"
    alias: agentRuntime
    condition: agentRuntime.enabled
    tags:
      - agent-runtime
