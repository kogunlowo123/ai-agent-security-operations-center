apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-soc-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: ai-soc-app-of-apps
    app.kubernetes.io/part-of: ai-agent-soc
spec:
  project: default
  source:
    repoURL: https://github.com/kogunlowo123/ai-agent-security-operations-center.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
