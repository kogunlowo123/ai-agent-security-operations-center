---
# ArgoCD Sync Wave Annotations Reference
#
# This ConfigMap documents the sync wave ordering used across all SOC platform
# ArgoCD applications. Sync waves ensure ordered deployment: wave N resources
# are not applied until all wave N-1 resources are healthy.
#
# Wave ordering:
#   Wave -5:  CRDs and cluster-scoped prerequisites
#   Wave -3:  Namespaces and RBAC
#   Wave -1:  Secrets management (External Secrets Operator)
#   Wave 0:   Infrastructure (databases, message queues, caches)
#   Wave 1:   Observability stack (OTel Collector, Prometheus, Grafana)
#   Wave 2:   Core platform services (API, event processor)
#   Wave 3:   Agent runtime services
#   Wave 5:   Ingress and load balancers
#   Wave 10:  Post-deployment verification jobs
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-sync-wave-reference
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-agent-soc
    app.kubernetes.io/component: deployment-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  wave-ordering: |
    Wave -5: CRDs
    - cert-manager CRDs
    - External Secrets Operator CRDs
    - OpenTelemetry Operator CRDs
    - Kyverno policy CRDs

    Wave -3: Namespaces and RBAC
    - Namespace: soc-platform
    - Namespace: observability
    - ClusterRole: soc-api-role
    - ClusterRoleBinding: soc-api-binding
    - ServiceAccount: soc-api
    - ServiceAccount: soc-agent-runtime
    - NetworkPolicy: soc-platform-default-deny

    Wave -1: Secrets Management
    - ExternalSecret: soc-db-credentials
    - ExternalSecret: soc-jwt-signing-key
    - ExternalSecret: soc-bedrock-credentials
    - ExternalSecret: soc-opensearch-credentials
    - Certificate: soc-api-tls (cert-manager)
    - Certificate: otel-collector-tls

    Wave 0: Infrastructure
    - PostgreSQL (RDS Proxy endpoint or in-cluster via Bitnami chart)
    - OpenSearch (cluster or AWS OpenSearch Service endpoint ConfigMap)
    - Redis (ElastiCache endpoint or in-cluster)
    - SQS Queue reference ConfigMap

    Wave 1: Observability
    - OpenTelemetry Collector DaemonSet
    - OpenTelemetry Collector Deployment (aggregator)
    - Prometheus ServiceMonitors
    - Grafana Dashboards ConfigMap

    Wave 2: Core Platform Services
    - Deployment: soc-api
    - HorizontalPodAutoscaler: soc-api
    - PodDisruptionBudget: soc-api
    - Service: soc-api
    - ConfigMap: soc-api-config
    - Deployment: soc-event-processor
    - HorizontalPodAutoscaler: soc-event-processor

    Wave 3: Agent Runtime
    - Deployment: soc-agent-runtime
    - HorizontalPodAutoscaler: soc-agent-runtime
    - PodDisruptionBudget: soc-agent-runtime
    - Service: soc-agent-runtime
    - ConfigMap: soc-agent-runtime-config

    Wave 5: Ingress
    - Ingress: soc-api-ingress
    - Ingress: soc-grafana-ingress
    - Gateway: soc-istio-gateway (if using Istio)
    - VirtualService: soc-api-vs

    Wave 10: Verification
    - Job: soc-smoke-test
    - Job: soc-db-migration-check
    - Job: soc-health-check

  annotation-examples: |
    # Apply wave annotation to any Kubernetes resource:
    #
    # apiVersion: apps/v1
    # kind: Deployment
    # metadata:
    #   name: soc-api
    #   annotations:
    #     argocd.argoproj.io/sync-wave: "2"
    #
    # apiVersion: batch/v1
    # kind: Job
    # metadata:
    #   name: soc-smoke-test
    #   annotations:
    #     argocd.argoproj.io/sync-wave: "10"
    #     argocd.argoproj.io/hook: PostSync
    #     argocd.argoproj.io/hook-delete-policy: HookSucceeded

  resource-health-checks: |
    # ArgoCD custom health checks ensure waves progress correctly.
    # Add to argocd-cm ConfigMap in the argocd namespace:
    #
    # resource.customizations.health.batch_v1_Job: |
    #   hs = {}
    #   if obj.status ~= nil then
    #     if obj.status.failed ~= nil and obj.status.failed > 0 then
    #       hs.status = "Degraded"
    #       hs.message = "Job failed"
    #       return hs
    #     end
    #     if obj.status.succeeded ~= nil and obj.status.succeeded > 0 then
    #       hs.status = "Healthy"
    #       hs.message = "Job completed"
    #       return hs
    #     end
    #   end
    #   hs.status = "Progressing"
    #   hs.message = "Waiting for job completion"
    #   return hs
---
# Example PreSync hook for database migration (Wave 0)
apiVersion: batch/v1
kind: Job
metadata:
  name: soc-db-migration
  namespace: soc-platform
  labels:
    app.kubernetes.io/part-of: ai-agent-soc
    app.kubernetes.io/component: db-migration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ai-agent-soc
        app.kubernetes.io/component: db-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: soc-api
      containers:
        - name: migrate
          image: ghcr.io/acme-corp/soc-api:latest
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: soc-db-credentials
                  key: database-url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
# Post-sync smoke test job (Wave 10)
apiVersion: batch/v1
kind: Job
metadata:
  name: soc-smoke-test
  namespace: soc-platform
  labels:
    app.kubernetes.io/part-of: ai-agent-soc
    app.kubernetes.io/component: smoke-test
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ai-agent-soc
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: OnFailure
      containers:
        - name: smoke-test
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Running SOC API smoke tests..."
              # Health check
              curl -sf http://soc-api.soc-platform.svc.cluster.local/api/v1/health
              # Readiness check
              curl -sf http://soc-api.soc-platform.svc.cluster.local/api/v1/readiness
              echo "Smoke tests passed."
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
