name: "Setup Python with uv"
description: "Sets up Python 3.12 using uv package manager with dependency caching"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  working-directory:
    description: "Working directory for the project (where pyproject.toml lives)"
    required: false
    default: "."
  install-deps:
    description: "Whether to install project dependencies after setup"
    required: false
    default: "true"
  install-dev-deps:
    description: "Whether to install dev/test dependencies"
    required: false
    default: "true"

outputs:
  python-version:
    description: "The installed Python version"
    value: ${{ steps.setup-python.outputs.python-version }}
  cache-hit:
    description: "Whether the dependency cache was hit"
    value: ${{ steps.cache-deps.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
          **/requirements*.txt

    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache uv virtualenv
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.venv
          ~/.cache/uv
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory), format('{0}/pyproject.toml', inputs.working-directory)) }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ inputs.python-version }}-
          uv-${{ runner.os }}-

    - name: Install production dependencies
      if: inputs.install-deps == 'true' && inputs.install-dev-deps == 'false'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        uv sync --frozen --no-dev

    - name: Install all dependencies (including dev)
      if: inputs.install-deps == 'true' && inputs.install-dev-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        uv sync --frozen

    - name: Verify installation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        uv run python --version
        uv run python -c "import sys; print(f'Python {sys.version} at {sys.executable}')"
