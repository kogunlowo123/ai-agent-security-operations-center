name: "Setup Terraform"
description: "Sets up Terraform 1.8 with provider caching and plan formatting"

inputs:
  terraform-version:
    description: "Terraform version to install"
    required: false
    default: "1.8.5"
  working-directory:
    description: "Working directory containing Terraform configuration"
    required: false
    default: "./infra"
  backend-config:
    description: "Path to backend configuration file (relative to working-directory)"
    required: false
    default: ""
  var-file:
    description: "Path to a .tfvars file (relative to working-directory)"
    required: false
    default: ""

outputs:
  terraform-version:
    description: "The installed Terraform version"
    value: ${{ steps.setup-tf.outputs.terraform_version }}

runs:
  using: "composite"
  steps:
    - name: Setup Terraform ${{ inputs.terraform-version }}
      id: setup-tf
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: true

    - name: Cache Terraform providers
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.terraform
          ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-

    - name: Verify Terraform installation
      shell: bash
      run: terraform version

    - name: Terraform Format Check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform fmt -check -recursive -diff
      continue-on-error: false

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_CLI_ARGS_init: "-reconfigure"
      run: |
        if [ -n "${{ inputs.backend-config }}" ]; then
          terraform init -backend-config="${{ inputs.backend-config }}"
        else
          terraform init
        fi

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate -no-color
