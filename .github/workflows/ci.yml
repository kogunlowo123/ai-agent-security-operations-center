name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: "true"

      - name: Run ruff (linting)
        run: uv run ruff check . --output-format=github

      - name: Run ruff (formatting check)
        run: uv run ruff format --check .

      - name: Run black (format check)
        run: uv run black --check --diff .

      - name: Run mypy (type checking)
        run: uv run mypy . --ignore-missing-imports --strict

  # ─────────────────────────────────────────────
  # Job 2: Test
  # ─────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc_test
          POSTGRES_PASSWORD: soc_test_password
          POSTGRES_DB: soc_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://soc_test:soc_test_password@localhost:5432/soc_test_db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          install-dev-deps: "true"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=test-results.xml \
            -v \
            tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: Build API Docker image
  # ─────────────────────────────────────────────
  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push API image
        uses: ./.github/actions/docker-build-push
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          ecr-repository: ai-agent-soc/api
          image-tag: ${{ github.sha }}
          dockerfile: docker/api/Dockerfile
          context: .
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}

  # ─────────────────────────────────────────────
  # Job 4: Build Agent Runtime Docker image
  # ─────────────────────────────────────────────
  build-agent-runtime:
    name: Build Agent Runtime Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push agent runtime image
        uses: ./.github/actions/docker-build-push
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          ecr-repository: ai-agent-soc/agent-runtime
          image-tag: ${{ github.sha }}
          dockerfile: docker/agent-runtime/Dockerfile
          context: .
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}

  # ─────────────────────────────────────────────
  # Job 5: CI gate (all-pass)
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          echo "All required CI checks passed"
